# Vault dev server. Root token "root", KV v2 mounted at secret/. Not for production.
apiVersion: v1
kind: Namespace
metadata:
  name: vault
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault
---
# Lets Vault call the TokenReview API for the Kubernetes auth method.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: vault
spec:
  replicas: 1
  selector:
    matchLabels: {app: vault}
  template:
    metadata:
      labels: {app: vault}
    spec:
      serviceAccountName: vault
      containers:
        - name: vault
          image: hashicorp/vault:2.2.0
          args: ["server", "-dev", "-dev-root-token-id=root", "-dev-listen-address=0.0.0.0:8200"]
          env:
            - {name: SKIP_SETCAP, value: "true"}
            - {name: VAULT_ADDR, value: "http://127.0.0.1:8200"}
            - {name: VAULT_TOKEN, value: root}
          ports:
            - containerPort: 8200
          readinessProbe:
            httpGet: {path: /v1/sys/health, port: 8200}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault
spec:
  selector: {app: vault}
  ports:
    - port: 8200
      targetPort: 8200
