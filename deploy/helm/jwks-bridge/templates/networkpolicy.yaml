{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "jwks-bridge.fullname" . }}
  labels:
    {{- include "jwks-bridge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "jwks-bridge.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.publicFrom | nindent 8 }}
      ports:
        - port: public
    {{- if .Values.private.enabled }}
    - from:
        {{- toYaml .Values.networkPolicy.privateFrom | nindent 8 }}
      ports:
        - port: private
    {{- end }}
    - {{- with .Values.networkPolicy.adminFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      ports:
        - port: admin
{{- end }}
